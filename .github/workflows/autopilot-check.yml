# Manual: run once before the first real day, and whenever something looks off.
name: autopilot check
on:
  workflow_dispatch:
    inputs:
      claude:
        description: Also make one tiny Claude call to prove the login (uses a little of the plan)
        type: boolean
        default: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Claude Code (pinned)
        if: inputs.claude
        run: npm install -g @anthropic-ai/claude-code@2.1.317
      - name: Run the checks
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_PAGES_DOMAIN: ${{ vars.CF_PAGES_DOMAIN }}
          CLAUDE_FLAG: ${{ inputs.claude && '--claude' || '' }}
        run: node autopilot/preflight.mjs $CLAUDE_FLAG
      - name: Guard tests
        working-directory: autopilot
        run: node --test test/*.test.mjs

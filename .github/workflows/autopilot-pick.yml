# Morning: free keyword research, Claude picks 5 options, an issue asks the owner to choose.
name: autopilot pick
on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST
  workflow_dispatch:
    inputs:
      dry:
        description: Print the issue instead of opening it
        type: boolean
        default: false
      format:
        description: Force a format (extra post of any format on any day)
        type: choice
        options: ['', guide, listicle, comparison, news]
        default: ''
      extra:
        description: Open one more issue even if today's exists
        type: boolean
        default: false

permissions: {}
concurrency:
  group: autopilot-pick
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          IN_FORMAT: ${{ inputs.format }}
          IN_EXTRA: ${{ inputs.extra }}
        run: node autopilot/gate.mjs pick --format "$IN_FORMAT" --extra "$IN_EXTRA"

      - name: Keyword lab (free sources)
        if: steps.gate.outputs.go == 'true'
        env:
          FORMAT: ${{ steps.gate.outputs.format }}
          BING_WEBMASTER_KEY: ${{ secrets.BING_WEBMASTER_KEY }}
        run: node autopilot/pick.mjs lab --format "$FORMAT" --dir "$RUNNER_TEMP/pick"

      - name: Install Claude Code (pinned)
        if: steps.gate.outputs.go == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.317

      - name: Claude picks 5 options
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true   # if Claude fails, the script fills the options from the lab's own ranking
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATE: ${{ steps.gate.outputs.date }}
          FORMAT: ${{ steps.gate.outputs.format }}
        run: node autopilot/run-stage.mjs pick --dir "$RUNNER_TEMP/pick" --vars-env DATE,FORMAT

      - name: Open the issue
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOPILOT_OWNER: ${{ github.repository_owner }}
          FORMAT: ${{ steps.gate.outputs.format }}
          SLOT: ${{ steps.gate.outputs.slot }}
          DRY: ${{ inputs.dry && '--dry' || '' }}
        run: node autopilot/pick.mjs post --dir "$RUNNER_TEMP/pick" --format "$FORMAT" --slot "$SLOT" $DRY

      - name: Keep the research for debugging
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pick-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pick/candidates.json
            ${{ runner.temp }}/pick/digest.md
            ${{ runner.temp }}/pick/pick.result.json
          retention-days: 14
          if-no-files-found: ignore

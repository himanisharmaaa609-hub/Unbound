# Evening: drafted posts go live unless the owner replied "hold". Scripts only, no Claude.
# Cloudflare Pages deploys main on every push, so pushing main is the production deploy.
name: autopilot publish
on:
  schedule:
    - cron: '30 14 * * *'   # 20:00 IST
  workflow_dispatch:
    inputs:
      dry:
        description: Build and check, but do not push
        type: boolean
        default: false

permissions: {}
concurrency:
  group: autopilot-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Decide
        id: d
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: node autopilot/publish.mjs decide
      - name: Publish each ready draft
        if: steps.d.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          ISSUES: ${{ steps.d.outputs.issues }}
          DRY: ${{ inputs.dry && '--dry' || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          failed=0
          for n in $(node -p "JSON.parse(process.env.ISSUES).join(' ')"); do
            if ! node autopilot/publish.mjs ship --issue "$n" $DRY; then
              failed=1
              node autopilot/publish.mjs report --issue "$n" || true
              git fetch -q origin "$DEFAULT_BRANCH"
              git reset -q --hard "origin/$DEFAULT_BRANCH"
              git clean -fdq
            fi
          done
          exit $failed
